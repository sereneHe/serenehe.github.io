<script async defer src="https://buttons.github.io/buttons.js"></script>
<style>
  .native-name {
    margin-top: 0.25rem;
    margin-bottom: 0.25rem;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.3;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".avatar-emoji").forEach(function (node) {
      node.remove();
    });

    var titleNode =
      document.querySelector(".portrait-title .text-3xl") ||
      document.querySelector("#profile h1") ||
      document.querySelector("#profile .text-3xl.font-bold");

    if (titleNode && !document.querySelector(".native-name")) {
      var nativeName = document.createElement("div");
      nativeName.className = "native-name";
      nativeName.textContent = "贺晓宇";
      titleNode.insertAdjacentElement("afterend", nativeName);
    }

    document.querySelectorAll(".section-subheading").forEach(function (node) {
      if (node.textContent.trim() === "Interests") {
        node.textContent = "Research Interests";
      }
    });
  });
</script>
